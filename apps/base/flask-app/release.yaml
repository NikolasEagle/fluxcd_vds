apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flask-app
  namespace: default
spec:
  interval: 5m
  suspend: true
  chart:
    spec:
      chart: flask-app
      version: ">=0.0.1"
      sourceRef:
        kind: HelmRepository
        name: flask-app-helm-repo
        namespace: flux-system
      interval: 1m
  values:
    replicaCount: 1

    service:
      type: ClusterIP
      portName: flask-app-port
      protocol: TCP
      port: 5000
      targetPort: 5000

    ingress:
      enabled: true
      className: "traefik"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/request-body-size: "0"
      tls:
        - hosts:
            - flask.eagle.com.ru
          secretName: flask-tls
      hosts:
        - host: flask.eagle.com.ru
          paths:
            - path: /
              pathType: Prefix
