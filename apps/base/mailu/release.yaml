apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu
  namespace: default
spec:
  suspend: false
  interval: 5m
  chart:
    spec:
      chart: mailu
      version: ">=2.6.3"
      sourceRef:
        kind: HelmRepository
        name: mailu-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: mailu-config
      valuesKey: values.yaml
