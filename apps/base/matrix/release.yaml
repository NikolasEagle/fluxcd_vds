apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: matrix-stack
      version: "26.2.3"
      sourceRef:
        kind: HelmRepository
        name: matrix-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: matrix-config
      valuesKey: values.yaml
