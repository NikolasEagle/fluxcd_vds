apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: moviecat
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: moviecat
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: moviecat-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: moviecat-config
      valuesKey: values.yaml
