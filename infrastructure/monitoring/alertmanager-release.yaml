apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
  namespace: default
spec:
  suspend: false
  interval: 10m
  chart:
    spec:
      chart: alertmanager
      version: ">=1.37.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: alertmanager-config
      valuesKey: values.yaml
