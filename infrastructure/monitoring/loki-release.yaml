apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: default
spec:
  suspend: false
  interval: 10m
  chart:
    spec:
      chart: loki
      version: ">=7.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: loki-config
      valuesKey: values.yaml