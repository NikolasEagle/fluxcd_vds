apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: default
spec:
  suspend: false
  interval: 10m
  chart:
    spec:
      chart: loki
      version: ">=7.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-helm-repo
        namespace: flux-system
      interval: 1m
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 336h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

    enterprise:
      enabled: false

    test:
      enabled: false

    lokiCanary:
      enabled: false
      replicas: 0

    adminApi:
      replicas: 0

    gateway:
      enabled: false
      replicas: 0

    enterpriseGateway:
      replicas: 0

    ingress:
      enabled: false
      ingressClassName: ""
      annotations: {}
      labels: {}
      hosts:
        - loki.example.com
      tls: []

    singleBinary:
      replicas: 1
      persistence:
        whenScaled: Retain
        whenDeleted: Retain
        enableStatefulSetAutoDeletePVC: false
        enableStatefulSetRecreationForSizeChange: true
        enabled: true
        accessModes:
          - ReadWriteMany
        size: 20Gi

    write:
      replicas: 0

    read:
      replicas: 0

    backend:
      replicas: 0

    memcached:
      enabled: false

    memcachedExporter:
      enabled: false

    resultsCache:
      enabled: false
      replicas: 0

    chunksCache:
      enabled: false
      replicas: 0
