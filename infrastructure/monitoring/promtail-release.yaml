apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: default
spec:
  suspend: false
  interval: 10m
  chart:
    spec:
      chart: promtail
      version: ">=6.17.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: promtail-config
      valuesKey: values.yaml
