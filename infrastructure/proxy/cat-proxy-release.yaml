apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cat-proxy
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: cat-proxy
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: cat-proxy-helm-repo
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: cat-proxy-config
      valuesKey: values.yaml
